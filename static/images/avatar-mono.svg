<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="DO">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <!-- terminal tile -->
  <circle cx="120" cy="120" r="118" fill="#161821"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="url(#ring)" stroke-width="4"/>

  <!-- window dots (top) -->
  <circle cx="92"  cy="58" r="4" fill="#3a3f4b"/>
  <circle cx="108" cy="58" r="4" fill="#3a3f4b"/>
  <circle cx="124" cy="58" r="4" fill="#3a3f4b"/>

  <!-- initials -->
  <text x="120" y="140" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="96" font-weight="700"
        letter-spacing="2" fill="#e8eaf0">DO</text>

  <!-- prompt line -->
  <text x="120" y="182" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="22" font-weight="700" fill="#4fc3f7">&gt;_</text>
</svg>
